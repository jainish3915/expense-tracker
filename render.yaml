databases:
  - name: expense-tracker-db
    databaseName: expense_voucher
    user: expensetracker

services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build && npx prisma migrate deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://expense-tracker-frontend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

  - type: web
    name: expense-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://expense-tracker-api.onrender.com/api/v1
